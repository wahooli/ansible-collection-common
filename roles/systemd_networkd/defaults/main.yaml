# SPDX-License-Identifier: MIT-0
# defaults file for systemd_networkd

# Chroot path for installation scenarios (e.g., /mnt for arch-chroot)
# When set, all operations will target the chroot environment
# systemd_networkd_chroot_path: /mnt

# Base paths (will be prefixed with chroot_path when chroot_path is defined)
systemd_networkd_resolved_confd_dir: /etc/systemd/resolved.conf.d/
systemd_networkd_resolved_conf_file: /etc/systemd/resolved.conf
# systemd_networkd_resolved_confd: {}
# systemd_networkd_resolved_conf: {}

systemd_networkd_resolvconf_file: /etc/resolv.conf
# Network configuration directory
systemd_networkd_config_dir: /etc/systemd/network

# Network configurations
systemd_networkd_networks: {}
