# Backup existing configurations
systemd_networkd_backup: true
systemd_networkd_backup_dir: /etc/systemd/network/backup

# Cleanup orphaned configurations - remove Ansible-managed configurations that are no longer defined
systemd_networkd_cleanup_orphan_config: true
