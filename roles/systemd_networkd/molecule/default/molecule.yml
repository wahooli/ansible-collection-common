---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
- name: networkd-debian-12
  image: debian:12
  pre_build_image: false
  dockerfile: ../../../../molecule-shared/Dockerfile.debian-systemd.j2
  groups:
  - networkd_hosts
  tmpfs:
  - /run
  - /tmp
  tty: true
  privileged: true

- name: networkd-ubuntu-22.04
  image: ubuntu:22.04
  pre_build_image: false
  dockerfile: ../../../../molecule-shared/Dockerfile.debian-systemd.j2
  groups:
  - resolved_hosts
  - networkd_hosts
  tmpfs:
  - /run
  - /tmp
  tty: true
  privileged: true

- name: networkd-archlinux
  image: archlinux:base
  pre_build_image: false
  groups:
  - resolved_hosts
  - networkd_hosts
  dockerfile: ../../../../molecule-shared/Dockerfile.archlinux-systemd.j2
  tmpfs:
  - /run
  - /tmp
  tty: true
  privileged: true

