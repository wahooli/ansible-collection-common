---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
- name: borg-debian-12
  image: debian:12
  pre_build_image: false
  dockerfile: ../../../../molecule-shared/Dockerfile.debian-systemd.j2
  tmpfs:
  - /run
  - /tmp
  tty: true
  privileged: true

- name: borg-ubuntu-22.04
  image: ubuntu:22.04
  pre_build_image: false
  dockerfile: ../../../../molecule-shared/Dockerfile.debian-systemd.j2
  tmpfs:
  - /run
  - /tmp
  tty: true
  privileged: true

- name: borg-archlinux
  image: archlinux:base
  pre_build_image: false
  dockerfile: ../../../../molecule-shared/Dockerfile.archlinux-systemd.j2
  tmpfs:
  - /run
  - /tmp
  tty: true
  privileged: true

# - name: borg-rocky
#   image: rockylinux:9
#   # image: redhat/ubi9-init
