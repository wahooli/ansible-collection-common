provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
  inventory:
    group_vars:
      all:
        ansible_user: molecule
        borg_backup_instances:
        - name: home
          source_dirs:
          - /home
          - /etc
          schedule:
          - daily
          - weekly
          repository: /var/backup/borg/home-backup
        - name: opt
          passphrase: "very-secret-passphrase"
          source_dirs:
          - /opt
          schedule:
          - weekly
          repository: /var/backup/borg/opt-backup
verifier:
  name: ansible
