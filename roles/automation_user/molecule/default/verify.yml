---
- name: Verify automation_user role
  hosts: "!client_hosts"
  gather_facts: true
  tasks:
  - name: Get user information
    become: true
    ansible.builtin.getent:
      database: passwd
      key: "{{ automation_user_name | default('testuser') }}"
    register: user_check

  - name: Check if user exists
    become: true
    ansible.builtin.assert:
      that:
      - user_check.ansible_facts.getent_passwd is defined
      - (automation_user_name | default('testuser')) in user_check.ansible_facts.getent_passwd
      fail_msg: "User {{ automation_user_name | default('testuser') }} does not exist"
      success_msg: "User {{ automation_user_name | default('testuser') }} exists"

  - name: Check user UID
    become: true
    ansible.builtin.assert:
      that:
      - user_check.ansible_facts.getent_passwd[(automation_user_name | default('testuser'))][1] | int < 1000
      fail_msg: "User UID is not less than 1000 (not a system user)"
      success_msg: "User UID is less than 1000 (system user)"

  - name: Check user shell
    become: true
    ansible.builtin.assert:
      that:
      - user_check.ansible_facts.getent_passwd[(automation_user_name | default('testuser'))][5] == automation_user_shell
      fail_msg: "User shell is not {{ automation_user_shell }}"
      success_msg: "User shell is correctly set to {{ automation_user_shell }}"

  - name: Check if .ssh directory exists
    become: true
    ansible.builtin.stat:
      path: "/var/lib/{{ automation_user_name | default('testuser') }}/.ssh"
    register: ssh_dir_check

  - name: Verify .ssh directory exists and has correct permissions
    become: true
    ansible.builtin.assert:
      that:
      - ssh_dir_check.stat.exists
      - ssh_dir_check.stat.isdir
      - ssh_dir_check.stat.mode | int == 700  # 0700 in decimal
      fail_msg: ".ssh directory does not exist or has incorrect permissions"
      success_msg: ".ssh directory exists with correct permissions"

  - name: Check if authorized_keys file exists
    become: true
    ansible.builtin.stat:
      path: "/var/lib/{{ automation_user_name | default('testuser') }}/.ssh/authorized_keys"
    register: auth_keys_check

  - name: Verify authorized_keys file exists and has correct permissions
    become: true
    ansible.builtin.assert:
      that:
      - auth_keys_check.stat.exists
      - auth_keys_check.stat.isreg
      - auth_keys_check.stat.mode | int == 600  # 0600 in decimal
      fail_msg: "authorized_keys file does not exist or has incorrect permissions"
      success_msg: "authorized_keys file exists with correct permissions"

  - name: Check SSH configuration file
    become: true
    ansible.builtin.stat:
      path: "/etc/ssh/sshd_config.d/{{ automation_user_name | default('testuser') }}.conf"
    register: ssh_config_check

  - name: Verify SSH configuration file exists
    become: true
    ansible.builtin.assert:
      that:
      - ssh_config_check.stat.exists
      - ssh_config_check.stat.isreg
      fail_msg: "SSH configuration file does not exist"
      success_msg: "SSH configuration file exists"

  - name: Check SSH configuration content
    become: true
    ansible.builtin.slurp:
      src: "/etc/ssh/sshd_config.d/{{ automation_user_name | default('testuser') }}.conf"
    register: ssh_config_content

  # - name: Verify SSH configuration content
