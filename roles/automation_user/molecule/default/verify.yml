  - name: Check sudo configuration
    become: true
    ansible.builtin.stat:
      path: "/etc/sudoers.d/{{ automation_user_name | default('testuser') }}"
    register: sudo_config_check

  - name: Verify sudo configuration exists
    become: true
    ansible.builtin.assert:
      that:
      - sudo_config_check.stat.exists
      - sudo_config_check.stat.isreg
      fail_msg: "Sudo configuration file does not exist"
      success_msg: "Sudo configuration file exists"

  - name: Check sudo configuration content
    become: true
    ansible.builtin.slurp:
      src: "/etc/sudoers.d/{{ automation_user_name | default('testuser') }}"
    register: sudo_config_content

  - name: Verify sudo configuration content
    become: true
    ansible.builtin.assert:
      that:
      - "'testuser ALL=(ALL) NOPASSWD: ALL' in (sudo_config_content.content | b64decode)"
      fail_msg: "Sudo configuration file does not contain expected content"
      success_msg: "Sudo configuration file contains expected content"

  - name: Test SSH key authentication (dry run)
    become: true
    ansible.builtin.command:
      cmd: "ssh -o BatchMode=yes -o ConnectTimeout=5 {{ automation_user_name | default('testuser') }}@localhost echo 'SSH test successful'"
      chdir: /tmp
    register: ssh_test
    failed_when: false
    changed_when: false

  - name: Verify PAM configuration for su access restriction
    become: true
    ansible.builtin.slurp:
      src: /etc/pam.d/su
    register: pam_su_config

  - name: Verify su access is properly restricted via PAM configuration
    become: true
    ansible.builtin.assert:
      that:
      - "'pam_listfile.so item=user sense=deny file=/etc/security/su_disabled_users onerr=succeed' in (pam_su_config.content | b64decode)"
      fail_msg: "SU access restriction PAM configuration is not properly set up for {{ automation_user_name | default('testuser') }}"
      success_msg: "SU access restriction PAM configuration is properly set up for {{ automation_user_name | default('testuser') }}"

  - name: Verify automation user is in su_disabled_users file
    become: true
    ansible.builtin.slurp:
      src: /etc/security/su_disabled_users
    register: su_disabled_users_content

  - name: Verify automation user is in su_disabled_users file
    become: true
    ansible.builtin.assert:
      that:
      - automation_user_name | default('testuser') in (su_disabled_users_content.content | b64decode).split('\n')
      fail_msg: "User {{ automation_user_name | default('testuser') }} is not in su_disabled_users file"
      success_msg: "User {{ automation_user_name | default('testuser') }} is properly listed in su_disabled_users file"

  - name: Create test files in automation user's directory
    become: true
    ansible.builtin.file:
      path: "/var/lib/{{ automation_user_name | default('testuser') }}/{{ item }}"
      state: touch
      owner: "{{ automation_user_name | default('testuser') }}"
      group: "{{ automation_user_name | default('testuser') }}"
      mode: '0644'
    loop:
    - safe_rm_test.txt
    - testfile.txt

