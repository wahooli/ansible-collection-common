---
- name: Prepare
  hosts: all
  become: true
  tasks:
  - name: Update pacman package cache
    community.general.pacman:
      update_cache: true

  - name: Ensure dosfstools is installed
    community.general.pacman:
      name: dosfstools
      state: present

  - name: Create a 200MB ESP image file
    ansible.builtin.command:
      cmd: fallocate -l 200M /esp.img
    args:
      creates: /esp.img
    register: esp_img_command

  - name: Find free loop device
    ansible.builtin.command: losetup -f
    register: free_loopdev
    changed_when: free_loopdev.rc != 0
    failed_when: free_loopdev.rc != 0

  - name: Associate loop device with image
    become: true
    ansible.builtin.command: "losetup {{ free_loopdev.stdout | trim }} /esp.img"
    register: losetup_command
    changed_when: losetup_command.rc != 0
    failed_when: losetup_command.rc != 0

  - name: Format the loop device (if not already formatted)
    ansible.builtin.command: mkfs.vfat {{ free_loopdev.stdout | trim }}
    when: esp_img_command is changed

  - name: Mount the ESP image to /boot
    ansible.builtin.mount:
      path: /boot
      src: "{{ free_loopdev.stdout | trim }}"
      opts: "umask=0077"
      fstype: vfat
      state: mounted
