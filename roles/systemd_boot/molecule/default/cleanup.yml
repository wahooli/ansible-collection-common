---
- name: Cleanup
  hosts: all
  gather_facts: false
  tasks:
  - name: Wait for docker instances to be created
    ansible.builtin.wait_for_connection:
      timeout: 2
    register: wait_for_instances
    failed_when: false
    changed_when:
    - wait_for_instances.msg is defined
    - '"timed out waiting" in wait_for_instances.msg'

  - name: Cleanup boot
    when:
    - wait_for_instances is not changed
    block:
    - name: Unmount /boot
      become: true
      ansible.builtin.mount:
        path: /boot
        state: unmounted

    - name: "Cleanup dummy ESP"
      become: true
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          losetup -j /esp.img -n -O name | xargs -I{} losetup -d {}
      register: losetup_command
      changed_when: losetup_command.rc != 0
      failed_when: losetup_command.rc != 0

# end block Cleanup boot
