---
- name: "Wipe disk {{ disk.device }}"
  when: disk.wipe | default(false)
  block:
  - name: "Check if is mounted before wiping" # noqa: var-naming[no-role-prefix]
    ansible.builtin.command:
      cmd: "findmnt {{ disk.device }}"
    changed_when: false
    failed_when: false
    register: partitioning_findmnt

  - name: "Unmount all filesystems on {{ disk.device }}"
    ansible.builtin.command:
      cmd: "umount -A --recursive {{ disk.device }}"
    when: partitioning_findmnt.rc == 0
    changed_when: false
    failed_when: false

  - name: "Wipe partition table and filesystem signatures from {{ disk.device }}"
    ansible.builtin.command:
      cmd: "wipefs -a {{ disk.device }}"
    changed_when: true
    failed_when: false
# end block

# This single task replaces the three separate, static tasks from the old file.
# It loops over the 'partitions' list for the current 'disk'.
- name: "Create partitions on {{ disk.device }}"
  community.general.parted:
    device: "{{ disk.device }}"
    align: "{{ partition.align | default(omit) }}"
    label: "{{ partition.label | default('gpt') }}"
    number: "{{ partition_index + 1 }}" # Partition number is the loop index (1, 2, 3...)
    name: "{{ partition.name }}" # This sets the GPT partition name/label
    fs_type: "{{ partition.fs_type | default(omit) }}" # The filesystem type (e.g., fat32, ext4, xfs)
    part_start: "{{ partition.start | default(omit) }}"
    part_end: "{{ partition.end | default(omit) }}"
    part_type: "{{ partition.type | default('primary') }}"
    resize: "{{ partition.resize | default(omit) }}"
    flags: "{{ partition.flags | default(omit) }}" # Add flags if defined in the data
    state: "{{ partition.state | default('present') }}"
    unit: "{{ partition.unit | default(omit) }}"
  loop: "{{ disk.partitions }}"
  loop_control:
    loop_var: partition
    index_var: partition_index
