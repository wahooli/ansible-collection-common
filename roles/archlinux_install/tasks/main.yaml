---
# tasks file for archlinux_install
- name: Abort if the host is not booted from the Arch install media
  ansible.builtin.fail:
    msg: "This host is not booted from the Arch install media!"
  when: ansible_nodename != 'archiso'

- name: Abort if archlinux_install_disks is not set
  ansible.builtin.fail:
    msg: "archlinux_install_disks var is not defined!"
  when:
  - archlinux_install_disks is not defined
  - archlinux_install_disks | length < 1

# - name: Abort if archlinux_install_root_partition is not set
#   ansible.builtin.fail:
#     msg: "archlinux_install_boot_partition var is not defined!"
#   when:
#   - archlinux_install_boot_partition is not defined
#   - archlinux_install_boot_partition | length < 1

# - name: Abort if archlinux_install_root_partition is not set
#   ansible.builtin.fail:
#     msg: "archlinux_install_root_partition var is not defined!"
#   when:
#   - archlinux_install_root_partition is not defined
#   - archlinux_install_root_partition | length < 1

- name: Verify the boot mode # noqa: var-naming[no-role-prefix]
  ansible.builtin.stat:
    path: /sys/firmware/efi/efivars
  register: efivars

- name: Abort if host is not UEFI-capabile
  ansible.builtin.fail:
    msg: Target system is not UEFI-capabile. Aborting.
  when: archlinux_install_uefi and not efivars.stat.exists

- name: Update the system clock # noqa: var-naming[no-role-prefix]
  ansible.builtin.command:
    cmd: timedatectl set-ntp true
  failed_when: timedatectl_ntp.rc != 0
  changed_when: false
  register: timedatectl_ntp

- name: Add CachyOS repositories
  ansible.builtin.include_tasks: add-cachyos-repos.yaml
  when: archlinux_install_enable_cachyos_repositories or archlinux_install_zfs_root | default(false)

- name: Set up partitions
  ansible.builtin.include_tasks: partitioning.yaml
  loop: "{{ archlinux_install_disks }}"
  loop_control:
    loop_var: disk

- name: Set up mdadm arrays
  when: archlinux_install_mdadm is defined and archlinux_install_mdadm | length > 0
  ansible.builtin.include_tasks: mdadm-setup.yaml
  loop: "{{ archlinux_install_mdadm }}"
  loop_control:
    loop_var: md

- name: Set up LUKS devices
  when: archlinux_install_dm_crypt is defined and archlinux_install_dm_crypt | length > 0
  ansible.builtin.include_tasks: luks-setup.yaml
  loop: "{{ archlinux_install_dm_crypt }}"
  loop_control:
    loop_var: luks

- name: Set up LVM volumes
  when: archlinux_install_lvm is defined and archlinux_install_lvm | length > 0
  ansible.builtin.include_tasks: lvm-setup.yaml
  loop: "{{ archlinux_install_lvm }}"
  loop_control:
    loop_var: lvm

- name: Set up filesystems
  ansible.builtin.include_tasks: filesystems.yaml
  loop: "{{ archlinux_install_filesystems }}"
  loop_control:
    loop_var: fs

- name: Add btrfs-progs into additional packages
  ansible.builtin.set_fact:
    archlinux_install_additional_packages: "{{ (archlinux_install_additional_packages | default([])) + ['btrfs-progs'] }}"
  when:
  - archlinux_install_btrfs_subvolumes is defined
  - archlinux_install_btrfs_subvolumes | length > 0
  - "'btrfs-progs' not in (archlinux_install_additional_packages | default([]))"

- name: Create btrfs subvolumes
  when:
  - archlinux_install_btrfs_subvolumes is defined
  - archlinux_install_btrfs_subvolumes | length > 0
  ansible.builtin.include_tasks: btrfs-subvolumes.yaml
  loop: "{{ archlinux_install_btrfs_subvolumes }}"
  loop_control:
    loop_var: subvolume

- name: Mount filesystems
  ansible.builtin.include_tasks: mount-paths.yaml
  loop: "{{ archlinux_install_mounts }}"
  loop_control:
    loop_var: mount
    label: "{{ mount.path }}"

- name: Set up swap (files and partitions)
  when:
  - archlinux_install_swap is defined
  - archlinux_install_swap | length > 0
  ansible.builtin.include_tasks: swap-setup.yaml
  loop: "{{ archlinux_install_swap }}"
  loop_control:
    loop_var: swap_item

- name: Check if /mnt is mounted # noqa: var-naming[no-role-prefix]
  ansible.builtin.command: mountpoint -q /mnt
  register: mnt_mountpoint_check
  changed_when: false
  failed_when: false

- name: Abort if /mnt is not mounted
  ansible.builtin.fail:
    msg: "/mnt is not mounted! Aborting installation."
  when: mnt_mountpoint_check.rc != 0

- name: Create zfs rootfs and volumes
  when:
  - archlinux_install_zfs_root is defined
  - archlinux_install_zfs_root | bool
  - zfs_zpools is defined
  - zfs_zpools | length > 0
  ansible.builtin.include_tasks: zfs-install.yaml

- name: Install package python-passlib, pacman-contrib and other installation dependencies
  community.general.pacman:
    name: |-
      {{
        (["python-passlib"] if archlinux_install_users is defined else [])
        + (["pacman-contrib"] if archlinux_install_rankmirrors is defined else [])
        + (archlinux_install_dependencies | default([]))
      }}
    state: present
    update_cache: true
  tags:
  - molecule-idempotence-notest

- name: Install base system
  ansible.builtin.include_tasks: pacstrap.yaml

- name: Configure install
  ansible.builtin.include_tasks: configure.yaml

- name: Configure zfs
  ansible.builtin.include_tasks: configure-zfs.yaml
  when:
  - archlinux_install_zfs_root is defined
  - archlinux_install_zfs_root | bool
  - zfs_zpools is defined
  - zfs_zpools | length > 0

- name: Setup GRUB
  ansible.builtin.include_tasks: grub.yaml
  when: "'grub' in archlinux_install_additional_packages"

- name: Setup systemd-boot # noqa: var-naming[no-role-prefix]
  when:
  - archlinux_install_systemd_boot_entries is defined
  - archlinux_install_systemd_boot_entries | length > 0
  ansible.builtin.include_role:
    name: systemd_boot
  vars:
    # Set chroot path for installation
    systemd_boot_chroot_path: /mnt
    systemd_boot_entries: "{{ archlinux_install_systemd_boot_entries }}"

- name: Create users
  ansible.builtin.include_tasks: create-user.yaml
  when:
  - archlinux_install_users is defined
  loop: "{{ archlinux_install_users }}"
  loop_control:
    loop_var: user

- name: "Set root password" # noqa: var-naming[no-role-prefix]
  ansible.builtin.command:
    cmd: "arch-chroot /mnt usermod --password {{ archlinux_install_root_password | password_hash('sha512') }} root"
  failed_when: root_password.rc != 0
  changed_when: false
  register: root_password
  when:
  - archlinux_install_root_password is defined
  - archlinux_install_root_password | length > 1

- name: Zfs post install
  ansible.builtin.include_tasks: export-zfs.yaml
  when:
  - archlinux_install_zfs_root is defined
  - archlinux_install_zfs_root | bool
  - zfs_zpools is defined
  - zfs_zpools | length > 0
